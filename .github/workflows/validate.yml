name: Validación

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formato
        run: npx prettier --check .
      - name: Typecheck
        run: npm run typecheck
      - name: Pruebas unitarias
        run: npm test
      - name: Build
        run: npm run build
      - name: Pruebas E2E (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test
      - name: Pruebas E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultados-e2e-${{ matrix.os }}
          path: test-results/
          retention-days: 7
