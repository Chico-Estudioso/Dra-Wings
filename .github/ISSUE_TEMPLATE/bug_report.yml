name: Informe de error
description: Comunicar un problema de Dra-Wings
title: "[Error]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Descripción
      description: ¿Qué ha ocurrido?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abrir... 2. Crear... 3. Exportar..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Dra-Wings
  - type: input
    id: os
    attributes:
      label: Sistema operativo
  - type: textarea
    id: logs
    attributes:
      label: Registro de error (elimina datos personales antes de compartirlo)
